<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Countertop Microwave Cabinet -->
  <rect x="4" y="9" width="40" height="30" rx="3.5" />
  <!-- Door Glass Viewing Window -->
  <rect x="8" y="13" width="22" height="22" rx="2" />
  <!-- Control Panel Separator Line -->
  <line x1="33" y1="9" x2="33" y2="39" />
  <!-- Digital Clock / Timer Display -->
  <rect x="36" y="13" width="5" height="3" rx="0.5" />
  <!-- Touch Keypad Buttons -->
  <line x1="36" y1="20" x2="41" y2="20" />
  <line x1="36" y1="24" x2="41" y2="24" />
  <!-- Rotary Timer / Power Knob -->
  <circle cx="38.5" cy="31" r="2.5" />
  <!-- Door Grab Handle -->
  <line x1="28" y1="17" x2="28" y2="31" />
  <!-- Base Support Feet -->
  <line x1="8" y1="39" x2="8" y2="41" />
  <line x1="40" y1="39" x2="40" y2="41" />
</svg>
